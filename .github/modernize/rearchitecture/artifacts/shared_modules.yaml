modules:
  - name: common-training-utilities
    kind: utility
    source_loc: "common.py:104"
    used_by_units:
      - train-fashion-mnist-cnn
      - train-fashion-mnist-vgg16
      - train-fashion-mnist-resnet50
      - train-fashion-mnist-mobilenetv2
      - train-fashion-mnist-inceptionv3
      - train-fashion-mnist-efficientnetb0
      - test-fashion-mnist-dataset
    fields:
      - name: load_fashion_mnist
        type: "function: CSV dataset loading, validation split, normalization, reshape"
      - name: make_augmentation
        type: "function: TensorFlow augmentation pipeline"
      - name: compile_model
        type: "function: Keras compile helper"
      - name: get_callbacks
        type: "function: early stopping, learning-rate reduction, best-model checkpoint"
      - name: save_model_summary
        type: "function: writes Keras model summary"
      - name: plot_training_history
        type: "function: writes training metric plots and history"
      - name: evaluate_model
        type: "function: test evaluation metrics and reports"
