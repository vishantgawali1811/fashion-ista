        type: "str: results output root"
      - name: CLASS_NAMES
        type: "list[str]: Fashion-MNIST label mapping"
      - name: NUM_CLASSES
        type: "int: 10 Fashion-MNIST labels"
      - name: TRAIN_FILE
        type: "str: training CSV path"
      - name: TEST_FILE
        type: "str: test CSV path"
    god_class: false
    split_candidate: false
    migration_strategy: copy
    notes: "Shared dataset, callbacks, and evaluation helpers consumed by all training scripts and the dataset smoke script."
